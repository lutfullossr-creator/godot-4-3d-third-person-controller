name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.6"

jobs:
  apk:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.6
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          if [ -d /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          fi

      - name: Setup Android settings
        run: |
          mkdir -v -p ~/.config/godot
          cp -v /root/.config/godot/editor_settings-4*.tres ~/.config/godot/ || true
          JAVA_BIN=$(readlink -f "$(which java)")
          JDK=$(dirname "$(dirname "$JAVA_BIN")")
          echo "JDK=$JDK"
          [ -f /root/debug.keystore ] || keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /root/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          F=~/.config/godot/editor_settings-4.6.tres
          [ -f "$F" ] || printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$F"
          echo "" >> "$F"
          {
            echo "export/android/java_sdk_path = \"$JDK\""
            echo 'export/android/debug_keystore = "/root/debug.keystore"'
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } >> "$F"
          cat "$F"

      - name: Import resources
        run: godot --headless --verbose --editor --quit || true

      - name: Build APK
        run: |
          mkdir -v -p build/android
          godot --headless --verbose --export-debug "Android" build/android/zona.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zona-apk
          path: build/android/zona.apk
